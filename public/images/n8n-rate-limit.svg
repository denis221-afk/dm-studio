<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">API rate limit flow</title>
  <desc id="desc">Abstract illustration of an API request passing through batching, waiting and a controlled retry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171b17"/><stop offset="1" stop-color="#2c3425"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b6ed24"/><stop offset="1" stop-color="#d6ff71"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="230" fill="#b6ed24" opacity=".06"/>
  <circle cx="120" cy="570" r="260" fill="#b6ed24" opacity=".04"/>
  <text x="84" y="112" fill="#b6ed24" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">DM STUDIO / AUTOMATION</text>
  <text x="84" y="210" fill="#fff" font-family="Arial,sans-serif" font-size="72" font-weight="700">HTTP 429</text>
  <text x="88" y="258" fill="#c7cdbd" font-family="Arial,sans-serif" font-size="25">API RATE LIMIT</text>
  <g transform="translate(84 340)">
    <rect width="210" height="112" rx="20" fill="#252d21" stroke="#71815b" stroke-width="2"/>
    <text x="105" y="47" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">REQUEST</text>
    <text x="105" y="79" fill="#aeb8a0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">API</text>
    <path d="M230 56h76m-16-12 16 12-16 12" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="330" width="210" height="112" rx="20" fill="#252d21" stroke="#b6ed24" stroke-width="2"/>
    <text x="435" y="47" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">BATCH</text>
    <text x="435" y="79" fill="#aeb8a0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">SMALL GROUPS</text>
    <path d="M560 56h76m-16-12 16 12-16 12" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="660" width="170" height="112" rx="20" fill="#252d21" stroke="#71815b" stroke-width="2"/>
    <text x="745" y="47" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">WAIT</text>
    <text x="745" y="79" fill="#aeb8a0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">PAUSE</text>
    <path d="M850 56h76m-16-12 16 12-16 12" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="950" width="180" height="112" rx="20" fill="#b6ed24"/>
    <text x="1040" y="47" fill="#20251b" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">RETRY</text>
    <text x="1040" y="79" fill="#3f4b2c" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">BOUNDED</text>
  </g>
  <text x="84" y="540" fill="#d5dccb" font-family="Arial,sans-serif" font-size="22">Slow down first. Retry only when it is safe.</text>
  <text x="1115" y="574" fill="#8f9a81" font-family="Arial,sans-serif" font-size="16" text-anchor="end">n8n / HTTP / API</text>
</svg>
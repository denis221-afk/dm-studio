<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">API pagination</title>
  <desc id="desc">Neutral illustration of an API response passing a next-page cursor through several pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171b17"/><stop offset="1" stop-color="#2c3425"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b6ed24"/><stop offset="1" stop-color="#d6ff71"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="230" fill="#b6ed24" opacity=".06"/>
  <circle cx="110" cy="580" r="250" fill="#b6ed24" opacity=".04"/>
  <text x="84" y="112" fill="#b6ed24" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">DM STUDIO / AUTOMATION</text>
  <text x="84" y="214" fill="#fff" font-family="Arial,sans-serif" font-size="68" font-weight="700">API PAGINATION</text>
  <text x="88" y="263" fill="#c7cdbd" font-family="Arial,sans-serif" font-size="25">FETCH EVERY PAGE. VERIFY THE END.</text>
  <g transform="translate(84 350)">
    <rect width="220" height="116" rx="20" fill="#252d21" stroke="#71815b" stroke-width="2"/>
    <text x="110" y="48" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">REQUEST</text>
    <text x="110" y="82" fill="#aeb8a0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">PAGE 1</text>
    <path d="M238 58h70m-16-12 16 12-16 12" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="330" width="220" height="116" rx="20" fill="#252d21" stroke="#b6ed24" stroke-width="2"/>
    <text x="440" y="48" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">NEXT URL</text>
    <text x="440" y="82" fill="#aeb8a0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">OR CURSOR</text>
    <path d="M568 58h70m-16-12 16 12-16 12" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="660" width="190" height="116" rx="20" fill="#252d21" stroke="#71815b" stroke-width="2"/>
    <text x="755" y="48" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">PAGE 2</text>
    <text x="755" y="82" fill="#aeb8a0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">NEXT BATCH</text>
    <path d="M868 58h70m-16-12 16 12-16 12" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="960" width="150" height="116" rx="20" fill="#b6ed24"/>
    <text x="1035" y="48" fill="#20251b" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">DONE</text>
    <text x="1035" y="82" fill="#3f4b2c" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">END SIGNAL</text>
  </g>
  <text x="84" y="548" fill="#d5dccb" font-family="Arial,sans-serif" font-size="22">Follow the API contract. Check IDs before writing.</text>
  <text x="1115" y="579" fill="#8f9a81" font-family="Arial,sans-serif" font-size="16" text-anchor="end">n8n / HTTP / API</text>
</svg>
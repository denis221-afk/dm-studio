name: Verify site, SEO and server tests
on:
  push:
    branches:
      - main
      - "seo/**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/check-seo.mjs
      - run: node --test server/*.test.mjs
